name: Test the ARM64 Linux library
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
  push:
    branches:
      - main
      - develop
      - snapshot
      - "**"
jobs:
  test-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Print env
        run: env | sort
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'
      - name: Test Library on ARM64
        run: |
          chmod +x gradlew
          ./gradlew build test
        working-directory: j2735-2024-ffm-lib
