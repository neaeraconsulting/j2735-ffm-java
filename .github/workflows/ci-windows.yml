name: Test the windows DLL
on:
  pull_request:
    types:
      - opened
      - edited
  push:
    branches:
      - main
      - develop
      - snapshot
      - "*"
jobs:
  test:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'
      - name: Test Library
        working-directory: j2735-2024-ffm-lib
        run: .\gradlew.bat build test
