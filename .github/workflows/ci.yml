name: Run tests on pull requests
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - "**"
jobs:
  test-lib:
    # Same-repo PR branches are already covered by the push run; only run pull_request for forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Print env
        run: env | sort
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5 
        with:
          gradle-version: '9.1.0'
      - name: Test Library
        run: |
          chmod +x gradlew
          ./gradlew build test
        working-directory: j2735-2024-ffm-lib
  test-api:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Print env
        run: env | sort
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'
      - name: Test API
        run: |
          chmod +x gradlew
          ./gradlew build test
        working-directory: j2735-2024-api



