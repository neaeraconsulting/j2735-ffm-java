# Publish a snapshot that follows all PRs or pushes to the 'snapshot' branch
name: Publish JARs to the Maven Central Repository (Snapshots)
on:
  push:
    branches:
      - snapshot
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Get Version
        id: get_version
        run: |
          chmod +x gradlew
          echo "LIB_VERSION=$(./gradlew -q getVersion)" >> $GITHUB_OUTPUT
          if [ "${{ endsWith(steps.get_version.outputs.LIB_VERSION, '-SNAPSHOT' ) }}" ]; then
            echo "IS_SNAPSHOT=true" >> $GITHUB_OUTPUT
          else
            echo "IS_SNAPSHOT=false" >> $GITHUB_OUTPUT
          fi
        working-directory: j2735-2024-ffm-lib


      - name: Echo Version
        run: |
          echo "LIB_VERSION ${{ steps.get_version.outputs.LIB_VERSION }}"
#          echo "IS_SNAPSHOT: ${{ steps.get_version.outputs.IS_SNAPSHOT }}"

