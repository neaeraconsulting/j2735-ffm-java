name: Publish package to GitHub Packages
on:
  release:
    types: 
      - created
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Print env
        run: env | sort
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5 
        with:
          gradle-version: '9.1.0'
      - name: Build Ubuntu Noble native library
        run: |
          tar -xzf asn1_codec/asn1c_combined/generated-files/2024.tar.gz
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --parallel
          cp -L build-native/libasnapplication.so lib/libasnapplication.so
      - name: Publish package
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew clean test publish
        working-directory: j2735-2024-ffm-lib

